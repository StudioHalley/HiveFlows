name: whisper
slug: whisper
version: "1.0"
description: "Speech-to-Text (STT) avec faster-whisper — transcription audio multilingue rapide sur CPU"
image: hiveflows/whisper:latest
type: backend
ingress: none
port: 8080

resources:
  memory: 2g
  cpus: "2.0"

mounts:
  - host: ".hive/whisper/models"
    container: "/models"
    description: "Cache des modèles Whisper — persistant entre redémarrages"
  - host: "."
    container: "/workspace"
    description: "Workspace data — fichiers audio input + transcripts output"

tools:
  - name: transcribe
    description: >
      Transcrit un fichier audio en texte (STT) avec faster-whisper.
      Retourne un task_id immédiatement — la transcription tourne en arrière-plan.
      Utiliser get_transcription_result avec le task_id pour récupérer le transcript quand prêt.
      Les fichiers audio doivent être dans /workspace (mp3, wav, m4a, ogg, flac, etc.).
      Modèles disponibles : tiny, base, small (défaut), medium, large-v3.
      Langues : "auto" pour détection automatique, ou code langue ISO 639-1 (fr, en, de, es, ...).
    endpoint: /transcribe
    method: POST
    schema:
      audio_path:
        type: string
        required: true
        description: "Chemin absolu du fichier audio à transcrire (ex: /workspace/downloads/reunion.mp3)"
      model:
        type: string
        default: "small"
        description: "Modèle Whisper: tiny (39M), base (74M), small (244M, défaut), medium (769M), large-v3 (1.5G)"
      language:
        type: string
        default: "auto"
        description: "Langue de l'audio: 'auto' (détection automatique), 'fr', 'en', 'de', 'es', etc."
      format:
        type: string
        default: "json"
        description: "Format du transcript: json (défaut, avec segments), txt, vtt, srt"

  - name: get_transcription_result
    description: >
      Vérifie le résultat d'une transcription lancée avec transcribe.
      Retourne status ('pending', 'running', 'success', 'error') et, quand terminé,
      le transcript complet (texte + segments horodatés), la langue détectée, la durée,
      et le chemin du fichier transcript sauvegardé.
      Appeler toutes les 5-10 secondes (la transcription peut prendre 1-5 min selon taille).
    endpoint: /result
    method: GET
    schema:
      task_id:
        type: string
        required: true
        description: "task_id retourné par transcribe"

  - name: list_models
    description: >
      Liste les modèles Whisper disponibles et ceux déjà téléchargés localement.
      Les modèles sont téléchargés automatiquement au premier usage — prévoir quelques minutes.
    endpoint: /models
    method: GET
    schema: {}

icon: mdi-microphone-message
